server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames are immutable; index.html must never be cached
  # or a deploy leaves clients on the old bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }

  # SPA proxying, so the browser sees one origin and the httpOnly refresh
  # cookie works exactly as it does in development.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE must not be buffered or the assistant stream arrives all at once.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /graphql {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Socket.IO's transport path; `/realtime` is the namespace, not the URL.
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
