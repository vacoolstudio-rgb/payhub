apiVersion: apps/v1
kind: Deployment
metadata:
  name: payhub-ledger
  namespace: payhub
  labels:
    app.kubernetes.io/name: payhub-ledger
    app.kubernetes.io/part-of: payhub
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payhub-ledger
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payhub-ledger
        app.kubernetes.io/part-of: payhub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
    spec:
      # Kafka rebalancing needs room: a consumer that is SIGKILLed mid-poll
      # forces the group to wait out the session timeout before reassigning.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ledger
          image: ghcr.io/payhub/ledger:latest
          ports:
            - name: http
              containerPort: 3001
            - name: grpc
              containerPort: 50051
          env:
            - name: SERVICE_NAME
              value: payhub-ledger
            - name: PORT
              value: "3001"
            - name: DATABASE_SCHEMA
              value: ledger
            - name: KAFKA_CONSUMER_GROUP
              value: payhub-ledger
            - name: GRPC_LISTEN_URL
              value: 0.0.0.0:50051
            - name: DATABASE_RUN_MIGRATIONS
              value: "false"
            # Pool size comes from a shared budget — see the full
            # arithmetic in api.yaml. Twenty pods at the ConfigMap default
            # of 20 would ask Postgres for 400 connections against a limit
            # of 200.
            # This service: the heaviest transactional work: FOR UPDATE on wallets, journal appends.
            - { name: DATABASE_POOL_MAX, value: "10" }
          envFrom:
            - configMapRef: { name: payhub-config }
            - secretRef: { name: payhub-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          # See api.yaml: the drain is the application's job now.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payhub-ledger
  namespace: payhub
spec:
  # Headless so gRPC clients see every pod and can load-balance per RPC.
  # A normal ClusterIP balances per *connection*, and HTTP/2 keeps one
  # connection open forever — so one pod would take all the traffic.
  clusterIP: None
  selector:
    app.kubernetes.io/name: payhub-ledger
  ports:
    - { name: grpc, port: 50051, targetPort: grpc }
    - { name: http, port: 3001, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payhub-ledger
  namespace: payhub
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payhub-ledger
